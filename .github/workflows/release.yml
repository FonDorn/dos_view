name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dosview") | .version')"

          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64

          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          name="dosview-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
          echo "ASSET=$name" >> "$GITHUB_ENV"

          cp "target/${{ matrix.target }}/release/dosview" "$name"
          chmod +x "$name"

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dosview-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.platform }}.exe"
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

          Copy-Item "target/${{ matrix.target }}/release/dosview.exe" $name

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find artifacts -type f -maxdepth 2 \
            -exec cp {} release/ \;

          ls -lah release

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          sha256sum * > SHA256SUMS

          echo
          echo "Checksums:"
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "dosview ${GITHUB_REF_NAME}" \
            --generate-notes